<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>latex-studio</title>
</head>
<body>
<div id="app">
    <header id="toolbar">
        <span id="app-title">Dokumen baru</span>
        <div id="toolbar-actions">
            <button id="btn-new" title="Dokumen baru">Baru</button>
            <button id="btn-open" title="Buka (Ctrl+O)">Buka</button>
            <button id="btn-save" title="Simpan (Ctrl+S)">Simpan</button>
            <button id="btn-save-as" title="Simpan sebagai (Ctrl+Shift+S)">Simpan sebagai</button>
            <button id="btn-export-pdf" title="Ekspor PDF hasil compile terakhir" disabled>Ekspor PDF</button>
        </div>
        <span id="status"></span>
    </header>
    <main id="panes">
        <div id="editor-pane"></div>
        <div id="preview-pane">
            <iframe id="pdf-frame" title="Preview PDF"></iframe>
            <pre id="log-pane" hidden></pre>
        </div>
    </main>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
